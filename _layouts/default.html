<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">
{% elsif site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
<style>
  :root{--fg:#1a1a1a;--muted:#666;--bg:#fff;--accent:#0b5fff;--rule:#e2e2e2}
  *{box-sizing:border-box}
  body{margin:0 auto;max-width:38rem;padding:2rem 1.1rem 4rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg);background:var(--bg);line-height:1.55;font-size:17px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header.site{margin-bottom:2rem;border-bottom:1px solid var(--rule);padding-bottom:1rem}
  header.site h1{font-size:1.3rem;margin:0}
  header.site h1 a{color:var(--fg)}
  header.site p{color:var(--muted);margin:.25rem 0 0;font-size:.95rem}
  main{min-height:60vh}
  article.entry{margin-bottom:2.2rem;padding-bottom:2.2rem;border-bottom:1px solid var(--rule)}
  article.entry:last-child{border-bottom:none}
  article.entry h2{margin:0 0 .3rem;font-size:1.15rem}
  article.entry .meta{color:var(--muted);font-size:.85rem;margin-bottom:.5rem}
  article.entry .blurb{margin:0 0 .5rem}
  .tags a{display:inline-block;font-size:.78rem;color:var(--muted);border:1px solid var(--rule);
    border-radius:3px;padding:.05rem .4rem;margin:0 .3rem .3rem 0}
  .tags a:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
  nav.pager{display:flex;justify-content:space-between;margin-top:2rem;font-size:.95rem}
  footer.site{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--rule);
    color:var(--muted);font-size:.85rem}
  h1,h2,h3{line-height:1.25}
  pre{overflow-x:auto;padding:.7rem;background:#f5f5f5;border-radius:4px;font-size:.85rem}
  code{font-size:.9em}
  img{max-width:100%;height:auto}
  blockquote{margin:0;padding-left:1rem;border-left:3px solid var(--rule);color:var(--muted)}
</style>
</head>
<body>
<header class="site">
  <h1><a href="{{ '/blog/' | relative_url }}">{{ site.title }}</a></h1>
  {% if site.description %}<p>{{ site.description }}</p>{% endif %}
</header>
<main>
{{ content }}
</main>
<footer class="site">
  <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · <a href="{{ '/blog/tags/' | relative_url }}">All tags</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
</footer>
</body>
</html>
