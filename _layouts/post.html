---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  {{ content }}
  {% if page.tags.size > 0 %}
  <p class="tags">
    {% for tag in page.tags %}<a href="{{ '/blog/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>{% endfor %}
  </p>
  {% endif %}
  <p><a href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a></p>
</article>
